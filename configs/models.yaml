# Model Konfigürasyonları
default_model: "zone_svm"

zone_svm:
  kernel: "rbf"
  probability: true
  cache_size: 1000
  random_state: 42
  
  # Validation kümesi üzerinde aranacak hiperparametre ızgarası
  param_grid:
    C: [0.1, 1.0, 10.0, 50.0, 100.0]
    gamma: ["scale", "auto", 0.01, 0.005, 0.001]
  
  # Eşik seçim yöntemi (validation üzerinde)
  threshold_metric: "youden"  # 'youden' (Sensitivity + Specificity - 1) veya 'f1'
  
  # Hasta düzeyinde olasılık birleştirme yöntemi
  patient_aggregation: "max"  # 'max' (Max pooling) veya 'noisy_or'

scaling:
  type: "standard"
  with_mean: true
  with_std: true

zone_knn:
  k_neighbors: [1, 3, 5, 7, 11]
  weights: "uniform"
  metric: "minkowski"
  threshold_metric: "youden"
  patient_aggregation: "max"

zone_cnn:
  in_channels: 2
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  max_epochs: 40
  threshold_metric: "youden"
  patient_aggregation: "max"


