[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "node21-tda"
version = "3.0.0"
description = "NODE21 CXR: 5 anatomik zon + Kübik Kalıcı Homoloji (TDA) ile nodül risk triyajı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchxrayvision>=1.5.0",
    "SimpleITK>=2.4.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "scipy>=1.14.0",
    "gudhi>=3.10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
